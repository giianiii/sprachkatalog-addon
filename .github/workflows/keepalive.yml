name: Aktiv halten

# GitHub schaltet geplante Abläufe in öffentlichen Repos nach 60 Tagen ohne Änderung ab.
# Dieser Ablauf aktualisiert einmal im Monat nur die Datei .github/keepalive.txt,
# damit die stündliche Katalog-Prüfung dauerhaft weiterläuft.

on:
  schedule:
    - cron: "41 3 1 * *"   # am 1. jedes Monats
  workflow_dispatch: {}

# Schreibrecht nur für diesen kleinen Ablauf, nicht für den Katalog-Bau
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zeitstempel aktualisieren
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "Aktiv halten: $(date -u +%Y-%m-%d)"
          git push
