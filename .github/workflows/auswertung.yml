name: Auswertung (nur lesend)

# Manuell starten: Actions → Auswertung (nur lesend) → Run workflow.
# Ändert weder Prüfstand noch Kataloge; Ergebnis steht in der Zusammenfassung des Laufs.
on:
  workflow_dispatch:
    inputs:
      stichprobe:
        description: "Anzahl Titel in der Stichprobe (max. 60)"
        default: "50"
      diagnose:
        description: "IMDb-IDs für vollständige Stream-Listen, mit Komma getrennt (Serie: tt…:Staffel:Folge)"
        default: ""

permissions:
  contents: read

# Gleiche Gruppe wie „Katalog bauen“: läuft nie gleichzeitig, damit sich die Abfragen nicht ins Gehege kommen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  auswertung:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Auswertung
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          AIOSTREAMS_URL: ${{ secrets.AIOSTREAMS_URL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SAMPLE: ${{ inputs.stichprobe }}
          DIAG: ${{ inputs.diagnose }}
        run: node scripts/auswertung.mjs
